name: Temporary Watch Trends Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed watch files
        run: |
          npx prettier --write 'app/watch/trends/page.tsx' 'lib/queries/watch-trends.ts' 'lib/watch/trends.ts' 'tests/watch/trends.test.ts'
          node -e 'const fs=require("fs");for(const p of ["app/watch/trends/page.tsx","lib/queries/watch-trends.ts","lib/watch/trends.ts","tests/watch/trends.test.ts"]){console.log("TRENDS_FORMATTED "+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))}'
