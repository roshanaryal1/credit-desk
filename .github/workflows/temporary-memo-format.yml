name: Temporary Evidence Memo Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: |
          npx prettier --write 'app/credit-memos/[id]/export/route.ts' 'lib/credit/memo-export.ts' 'tests/credit/memo-export.test.ts'
          node -e 'const fs=require("fs");for(const p of ["app/credit-memos/[id]/export/route.ts","lib/credit/memo-export.ts","tests/credit/memo-export.test.ts"]){console.log("MEMO_FORMATTED "+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))}'
