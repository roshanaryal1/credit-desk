name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Temporary review-smoke formatter capture
        run: |
          npx prettier --write scripts/review-ui-smoke.mjs
          node -e 'const fs=require("fs");const b=fs.readFileSync("scripts/review-ui-smoke.mjs").toString("base64");for(let i=0;i<b.length;i+=850)console.log("FORMATTED|"+i+"|"+b.slice(i,i+850));'
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run check:bundle
      - name: eval
        if: hashFiles('scripts/eval.ts') != ''
        run: npm run eval
