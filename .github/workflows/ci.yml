name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Temporary formatting diagnostics
        run: |
          npx prettier --write "app/clients/[id]/page.tsx" "lib/queries/client-ageing.ts" "tests/queries/client-ageing.test.ts"
          node -e 'const fs=require("fs");for(const p of process.argv.slice(1)){const b=fs.readFileSync(p).toString("base64");for(let i=0;i<b.length;i+=850)console.log("FORMATTED|"+p+"|"+i+"|"+b.slice(i,i+850));}' "app/clients/[id]/page.tsx" "lib/queries/client-ageing.ts" "tests/queries/client-ageing.test.ts"
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run check:bundle
      - name: eval
        if: hashFiles('scripts/eval.ts') != ''
        run: npm run eval
