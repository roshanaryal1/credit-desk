name: Temporary persona read-only formatting report
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format edited code
        run: |
          npx prettier --write 'lib/queries/invoice.ts' 'components/invoice-panel.tsx' 'app/watch/page.tsx'
          node -e 'const fs=require("fs");for(const p of ["lib/queries/invoice.ts","components/invoice-panel.tsx","app/watch/page.tsx"]){console.log("READONLY_FORMATTED "+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))}'
