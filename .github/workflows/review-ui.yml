name: Review UI smoke (synthetic only)

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - ".github/workflows/review-ui.yml"
      - "scripts/review-ui-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ""
      REVIEW_URL: http://127.0.0.1:3100
      CREDIT_DESK_CI_PGLITE: "1"
      PLAYWRIGHT_PACKAGE: /tmp/credit-desk-review-browser/node_modules/playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate disposable CI-only login credentials
        run: |
          echo "DEMO_PASSWORD=synthetic-review-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Seed offline synthetic ledger and incident history
        run: npm run seed -- --target=local
      - name: Build production-mode Next application
        run: npm run build
      - name: Install isolated browser runner
        run: |
          npm install --prefix /tmp/credit-desk-review-browser --no-save --package-lock=false playwright@1.56.1
          /tmp/credit-desk-review-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start production-mode application and verify login responds
        run: |
          npm run start -- -p 3100 > /tmp/credit-desk-review-server.log 2>&1 &
          echo $! > /tmp/credit-desk-review-server.pid
          for i in $(seq 1 90); do
            if curl --silent --show-error --fail "http://127.0.0.1:3100/login" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/credit-desk-review-server.log
          exit 1
      - name: Verify authenticated routes and capture screenshots
        run: node scripts/review-ui-smoke.mjs
      - name: Upload authentic synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credit-desk-ui-review-${{ github.run_id }}
          path: |
            evidence/ui/
            /tmp/credit-desk-review-server.log
          retention-days: 7
          if-no-files-found: warn
