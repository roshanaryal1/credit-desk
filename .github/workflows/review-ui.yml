name: Review UI smoke (synthetic only)

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - ".github/workflows/review-ui.yml"
      - "scripts/review-ui-smoke.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ""
      REVIEW_URL: http://127.0.0.1:3100
      CREDIT_DESK_CI_PGLITE: "1"
      # This workflow seeds fictional data only; never set on a live deployment.
      PUBLIC_DEMO_ENABLED: "1"
      CREDIT_DESK_DATA_CLASSIFICATION: "SYNTHETIC"
      PLAYWRIGHT_PACKAGE: playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the project package manager
        run: npm install --global npm@12.2.1
      - name: Generate disposable CI-only login credentials
        run: |
          # Mask before export: the repository and its Actions logs are public.
          password="synthetic-review-$(openssl rand -hex 16)"
          secret="$(openssl rand -hex 48)"
          echo "::add-mask::$password"
          echo "::add-mask::$secret"
          echo "DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Seed offline synthetic ledger and incident history
        run: npm run seed -- --target=local
      - name: Build production-mode Next application
        run: npm run build
      - name: Install lockfile-pinned browser runner
        run: npx playwright install --with-deps chromium
      - name: Start production-mode application and verify login responds
        run: |
          npm run start -- -p 3100 > /tmp/credit-desk-review-server.log 2>&1 &
          echo $! > /tmp/credit-desk-review-server.pid
          for i in $(seq 1 90); do
            if curl --silent --show-error --fail "http://127.0.0.1:3100/login" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/credit-desk-review-server.log
          exit 1
      - name: Verify authenticated routes and capture screenshots
        run: node scripts/review-ui-smoke.mjs
      - name: Upload authentic synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credit-desk-ui-review-${{ github.run_id }}
          path: |
            evidence/ui/
            /tmp/credit-desk-review-server.log
          retention-days: 7
          if-no-files-found: warn
