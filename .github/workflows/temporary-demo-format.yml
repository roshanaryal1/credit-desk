name: Temporary persona formatting report
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format touched role files and print results
        run: |
          npx prettier --write 'app/actions.ts' 'app/demo/client/page.tsx' 'app/login/actions.ts' 'app/login/login-form.tsx' 'app/login/page.tsx' 'components/nav.tsx' 'components/sign-out.tsx' 'lib/demo-personas.ts' 'lib/demo-session.ts' 'proxy.ts' 'scripts/review-ui-smoke.mjs' 'tests/auth/demo-personas.test.ts'
          node -e 'const fs=require("fs");for(const p of ["app/actions.ts","app/demo/client/page.tsx","app/login/actions.ts","app/login/login-form.tsx","app/login/page.tsx","components/nav.tsx","components/sign-out.tsx","lib/demo-personas.ts","lib/demo-session.ts","proxy.ts","scripts/review-ui-smoke.mjs","tests/auth/demo-personas.test.ts"]){console.log("PERSONA_FORMATTED "+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))}'
